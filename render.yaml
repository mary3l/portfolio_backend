# Render blueprint. Keeps the build and start commands in the repo instead of
# the dashboard, so a redeploy from scratch reproduces the same service.
#
# Secrets use `sync: false`: Render prompts for them once and stores them
# encrypted, rather than this file carrying the service_role key into git.

services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    # Closest free region to Manila. Oregon/Frankfurt/Ohio/Virginia also work.
    region: singapore

    buildCommand: pip install -r requirements.txt
    # 0.0.0.0 and $PORT are both required — the default localhost bind is
    # unreachable from outside the container.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # /health returns 200 even when Supabase is unreachable, so this probe
    # restarts the service only when the app itself is down.
    healthCheckPath: /health

    envVars:
      - key: SUPABASE_URL
        sync: false
      # Must be the service_role (or sb_secret_) key; the anon key cannot
      # write past row level security.
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Exact-match origins, comma separated. Add the Vercel production URL
      # here once the frontend is deployed.
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      # Contact form. Leave RESEND_API_KEY unset to disable the endpoint.
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
